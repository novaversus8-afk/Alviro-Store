<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Food Fart Delivery</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#172033
}
button,input,select{font:inherit}
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,#ff4b2b,#ff1744);
  color:white;padding:15px
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px
}
.logo{font-size:23px;font-weight:800}
.top button{
  border:0;border-radius:22px;padding:10px 14px;background:white;color:#111
}
.container{max-width:900px;margin:auto;padding:15px}
.hero{
  background:linear-gradient(135deg,#171d45,#4024a7);
  color:#fff;border-radius:25px;padding:25px;margin-bottom:15px
}
.hero h1{margin:0 0 8px;font-size:30px}
.search{
  width:100%;padding:16px;border:0;border-radius:18px;
  margin:10px 0;outline:0;background:white
}
.cats{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}
.cats button{
  white-space:nowrap;border:0;padding:11px 17px;border-radius:22px;
  background:white
}
.cats button.active{background:#ff1744;color:white}
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
.card{
  background:white;border-radius:20px;padding:13px;
  box-shadow:0 2px 10px #0000000d
}
.pic{
  height:100px;border-radius:16px;background:#f1f3f6;
  display:flex;align-items:center;justify-content:center;font-size:55px
}
.card h3{margin:9px 0 4px;font-size:17px}
.price{font-weight:bold;font-size:18px}
.add{
  width:100%;margin-top:8px;border:0;border-radius:13px;
  background:#ff1744;color:white;padding:11px;font-weight:bold
}
.cartbar{
  position:fixed;bottom:15px;left:15px;right:15px;z-index:60;
  max-width:870px;margin:auto;background:#111827;color:white;
  padding:15px 18px;border-radius:18px;display:flex;
  justify-content:space-between;align-items:center
}
.cartbar button{
  background:#ff1744;color:white;border:0;padding:10px 18px;
  border-radius:12px;font-weight:bold
}
.panel{
  display:none;position:fixed;inset:0;background:#0008;z-index:100;
  overflow:auto
}
.sheet{
  background:white;max-width:700px;margin:30px auto 0;
  min-height:90vh;border-radius:25px 25px 0 0;padding:20px
}
.close{
  float:right;border:0;border-radius:50%;width:42px;height:42px
}
.row{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:12px 0
}
.qty button{
  width:32px;height:32px;border:0;border-radius:8px;background:#eee
}
.field{
  width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;
  border-radius:12px;outline:0
}
.pay{
  border:2px solid #ddd;padding:14px;border-radius:15px;margin:8px 0
}
.pay.selected{border-color:#ff1744;background:#fff1f3}
.primary{
  width:100%;padding:15px;border:0;border-radius:14px;
  background:#ff1744;color:white;font-weight:bold;margin-top:10px
}
.status{
  padding:10px;border-radius:12px;background:#eef2ff;margin:8px 0
}
.green{background:#e9f9ee;color:#08752c}
.red{background:#fff0f0;color:#b00020}
.order{
  background:white;border-radius:18px;padding:15px;margin:10px 0
}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>

<header>
 <div class="top">
   <div class="logo">🚚 Food Fart Delivery</div>
   <div>
     <button onclick="openOrders()">📦 Orders</button>
     <button onclick="openCart()">🛒 <span id="cartCount">0</span></button>
   </div>
 </div>
</header>

<main class="container">

<section class="hero">
 <h1>🍔 Food Fart Delivery</h1>
 <div>आपके घर तक Grocery & Food Delivery</div>
 <p>🚚 Fast Delivery &nbsp; • &nbsp; 💵 COD &nbsp; • &nbsp; 📱 UPI</p>
</section>

<input id="search" class="search"
 placeholder="🔎 सामान खोजें..."
 oninput="renderProducts()">

<div class="cats" id="cats"></div>

<div class="grid" id="products"></div>

</main>

<div class="cartbar">
 <span>🛒 <b id="barItems">0</b> items • ₹<b id="barTotal">0</b></span>
 <button onclick="openCart()">Cart खोलें</button>
</div>

<!-- CART -->
<div class="panel" id="cartPanel">
 <div class="sheet">
  <button class="close" onclick="closePanel('cartPanel')">✕</button>
  <h2>🛒 आपका Cart</h2>
  <div id="cartList"></div>
  <hr>
  <h2>कुल: ₹<span id="cartTotal">0</span></h2>
  <button class="primary" onclick="checkout()">Checkout</button>
 </div>
</div>

<!-- CHECKOUT -->
<div class="panel" id="checkoutPanel">
 <div class="sheet">
  <button class="close" onclick="closePanel('checkoutPanel')">✕</button>
  <h2>📦 Order Details</h2>

  <input id="customerName" class="field" placeholder="आपका नाम">
  <input id="customerPhone" class="field" placeholder="मोबाइल नंबर">
  <textarea id="customerAddress" class="field"
    rows="3" placeholder="पूरा Delivery Address"></textarea>

  <button class="primary" onclick="getLocation()">
    📍 Current Location लें
  </button>

  <input type="hidden" id="lat">
  <input type="hidden" id="lng">

  <h3>💳 Payment</h3>

  <div class="pay selected" id="codPay" onclick="selectPay('COD')">
    💵 Cash on Delivery
  </div>

  <div class="pay" id="upiPay" onclick="selectPay('UPI')">
    📱 Online Payment / UPI
  </div>

  <button class="primary" onclick="placeOrder()">
    🚀 Order Place करें
  </button>

  <p id="paymentInfo"></p>
 </div>
</div>

<!-- ORDERS -->
<div class="panel" id="ordersPanel">
 <div class="sheet">
  <button class="close" onclick="closePanel('ordersPanel')">✕</button>
  <h2>📦 My Orders</h2>
  <div id="ordersList"></div>
 </div>
</div>

<script type="module">

/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,collection,addDoc,getDocs,query,where,
 orderBy,onSnapshot,doc,updateDoc,serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getAuth,signInAnonymously,onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* अपनी Firebase Console की config यहां डालें */

const firebaseConfig = {
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID",
 storageBucket:"YOUR_PROJECT.appspot.com",
 messagingSenderId:"YOUR_SENDER_ID",
 appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let currentUser=null;

try{
 await signInAnonymously(auth);
}catch(e){
 console.log("Firebase Auth:",e.message);
}

onAuthStateChanged(auth,u=>{
 currentUser=u;
});


/* =====================================================
   STORE SETTINGS
   ===================================================== */

const STORE_NAME="Food Fart Delivery";

/* आपका UPI ID */
const STORE_UPI="7209000233@fam";


/* =====================================================
   50 PRODUCTS
   ===================================================== */

const products=[

["आलू","🥔",40,"Vegetables"],
["प्याज","🧅",35,"Vegetables"],
["टमाटर","🍅",45,"Vegetables"],
["गोभी","🥦",50,"Vegetables"],
["गाजर","🥕",55,"Vegetables"],
["खीरा","🥒",40,"Vegetables"],
["बैंगन","🍆",45,"Vegetables"],
["भिंडी","🌿",60,"Vegetables"],
["पालक","🥬",30,"Vegetables"],
["मटर","🫛",80,"Vegetables"],

["सेब","🍎",140,"Fruits"],
["केला","🍌",60,"Fruits"],
["संतरा","🍊",90,"Fruits"],
["आम","🥭",120,"Fruits"],
["अंगूर","🍇",110,"Fruits"],
["तरबूज","🍉",50,"Fruits"],
["अनार","🍎",150,"Fruits"],
["पपीता","🥭",70,"Fruits"],
["नाशपाती","🍐",130,"Fruits"],
["नींबू","🍋",70,"Fruits"],

["चावल 1kg","🍚",70,"Grocery"],
["गेहूं आटा 1kg","🌾",55,"Grocery"],
["चीनी 1kg","🧂",48,"Grocery"],
["नमक 1kg","🧂",25,"Grocery"],
["दाल 1kg","🫘",110,"Grocery"],
["चना 1kg","🫘",90,"Grocery"],
["राजमा 1kg","🫘",130,"Grocery"],
["मूंग दाल 1kg","🫘",120,"Grocery"],
["तेल 1L","🫗",140,"Grocery"],
["बेसन 500g","🌾",65,"Grocery"],

["दूध 1L","🥛",65,"Dairy"],
["दही 500g","🥣",50,"Dairy"],
["पनीर 200g","🧀",90,"Dairy"],
["बटर 100g","🧈",60,"Dairy"],
["चीज 200g","🧀",130,"Dairy"],

["ब्रेड","🍞",45,"Bakery"],
["बिस्कुट","🍪",30,"Bakery"],
["केक","🍰",150,"Bakery"],
["रस्क","🥨",55,"Bakery"],
["टोस्ट","🍞",50,"Bakery"],

["कोल्ड ड्रिंक","🥤",45,"Beverages"],
["जूस","🧃",80,"Beverages"],
["पानी बोतल","💧",20,"Beverages"],
["चाय","☕",120,"Beverages"],
["कॉफी","☕",180,"Beverages"],

["साबुन","🧼",35,"Personal Care"],
["शैम्पू","🧴",120,"Personal Care"],
["टूथपेस्ट","🪥",95,"Personal Care"],
["टिश्यू","🧻",70,"Household"],
["डिटर्जेंट","🧺",110,"Household"]

].map((x,i)=>({
 id:i+1,name:x[0],emoji:x[1],price:x[2],category:x[3]
}));


/* =====================================================
   STATE
   ===================================================== */

let cart=JSON.parse(localStorage.getItem("ff_cart")||"{}");
let selectedPayment="COD";
let myOrders=[];

function saveCart(){
 localStorage.setItem("ff_cart",JSON.stringify(cart));
 updateCartUI();
}

function cartItems(){
 return Object.values(cart);
}

function cartCount(){
 return cartItems().reduce((a,b)=>a+b.qty,0);
}

function cartTotal(){
 return cartItems().reduce((a,b)=>a+b.price*b.qty,0);
}


/* =====================================================
   CATEGORIES
   ===================================================== */

function renderCats(){

 const cats=["All",...new Set(products.map(p=>p.category))];

 document.getElementById("cats").innerHTML=
 cats.map((c,i)=>
 `<button class="${i===0?'active':''}"
 onclick="filterCat('${c}',this)">${c}</button>`
 ).join("");

}

let selectedCat="All";

window.filterCat=function(cat,btn){
 selectedCat=cat;

 document.querySelectorAll(".cats button")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 renderProducts();
};


/* =====================================================
   PRODUCTS
   ===================================================== */

window.renderProducts=function(){

 const search=(document.getElementById("search").value||"")
 .toLowerCase();

 const list=products.filter(p=>
 (selectedCat==="All"||p.category===selectedCat) &&
 p.name.toLowerCase().includes(search)
 );

 document.getElementById("products").innerHTML=list.map(p=>`

 <div class="card">

   <div class="pic">${p.emoji}</div>

   <h3>${p.name}</h3>

   <small>${p.category}</small>

   <div class="price">₹${p.price}</div>

   <button class="add" onclick="addCart(${p.id})">
   + Add
   </button>

 </div>

 `).join("");

};


/* =====================================================
   CART
   ===================================================== */

window.addCart=function(id){

 const p=products.find(x=>x.id===id);

 if(!cart[id]){
   cart[id]={...p,qty:0};
 }

 cart[id].qty++;

 saveCart();
};

window.changeQty=function(id,n){

 if(!cart[id])return;

 cart[id].qty+=n;

 if(cart[id].qty<=0)delete cart[id];

 saveCart();
};

function updateCartUI(){

 const count=cartCount();
 const total=cartTotal();

 document.getElementById("cartCount").textContent=count;
 document.getElementById("barItems").textContent=count;
 document.getElementById("barTotal").textContent=total;

 document.getElementById("cartList").innerHTML=
 cartItems().length ?

 cartItems().map(p=>`

 <div class="row">

   <div>
    <b>${p.emoji} ${p.name}</b><br>
    ₹${p.price} × ${p.qty}
   </div>

   <div class="qty">
    <button onclick="changeQty(${p.id},-1)">−</button>
    ${p.qty}
    <button onclick="changeQty(${p.id},1)">+</button>
   </div>

 </div>

 `).join("")

 : "<p>Cart खाली है।</p>";

 document.getElementById("cartTotal").textContent=total;
}

window.openCart=function(){
 updateCartUI();
 document.getElementById("cartPanel").style.display="block";
};

window.checkout=function(){

 if(!cartItems().length){
   alert("पहले product Cart में add करें");
   return;
 }

 closePanel("cartPanel");
 document.getElementById("checkoutPanel").style.display="block";
};

window.closePanel=function(id){
 document.getElementById(id).style.display="none";
};


/* =====================================================
   LOCATION
   ===================================================== */

window.getLocation=function(){

 if(!navigator.geolocation){
   alert("इस device में Location उपलब्ध नहीं है");
   return;
 }

 navigator.geolocation.getCurrentPosition(pos=>{

   document.getElementById("lat").value=pos.coords.latitude;
   document.getElementById("lng").value=pos.coords.longitude;

   document.getElementById("customerAddress").value +=
   `\nGPS: ${pos.coords.latitude}, ${pos.coords.longitude}`;

 },()=>{
   alert("Location permission Allow करें");
 });

};


/* =====================================================
   PAYMENT
   ===================================================== */

window.selectPay=function(type){

 selectedPayment=type;

 document.getElementById("codPay")
 .classList.toggle("selected",type==="COD");

 document.getElementById("upiPay")
 .classList.toggle("selected",type==="UPI");

 if(type==="UPI"){

   document.getElementById("paymentInfo").innerHTML=
   `📱 UPI ID: <b>${STORE_UPI}</b><br>
    Order place करने के बाद आपका UPI app खुलेगा।`;

 }else{
   document.getElementById("paymentInfo").innerHTML="";
 }

};


/* =====================================================
   PLACE ORDER
   ===================================================== */

window.placeOrder=async function(){

 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("customerPhone").value.trim();
 const address=document.getElementById("customerAddress").value.trim();

 if(!name||!phone||!address){
   alert("Name, Mobile और Address भरें");
   return;
 }

 if(!currentUser){
   alert("Firebase connection तैयार नहीं है");
   return;
 }

 const orderData={

   customerId:currentUser.uid,

   customerName:name,

   customerPhone:phone,

   address:address,

   latitude:Number(document.getElementById("lat").value)||null,

   longitude:Number(document.getElementById("lng").value)||null,

   items:cartItems().map(x=>({
     id:x.id,
     name:x.name,
     price:x.price,
     qty:x.qty
   })),

   total:cartTotal(),

   paymentMethod:selectedPayment,

   paymentStatus:selectedPayment==="COD"
     ?"Pending":"Pending",

   status:"Order Placed",

   riderId:null,

   riderName:null,

   riderLat:null,

   riderLng:null,

   riderEarning:0,

   createdAt:serverTimestamp(),

   updatedAt:serverTimestamp()

 };

 try{

   const ref=await addDoc(
     collection(db,"orders"),
     orderData
   );

   localStorage.setItem("lastOrder",ref.id);

   if(selectedPayment==="UPI"){

     const upiURL=
     `upi://pay?pa=${encodeURIComponent(STORE_UPI)}`+
     `&pn=${encodeURIComponent(STORE_NAME)}`+
     `&am=${cartTotal()}`+
     `&cu=INR`+
     `&tn=${encodeURIComponent("Order "+ref.id)}`;

     window.location.href=upiURL;
   }

   cart={};
   saveCart();

   closePanel("checkoutPanel");

   alert("✅ Order successfully placed!");

   openOrders();

 }catch(e){

   console.error(e);
   alert("Order error: "+e.message);

 }

};


/* =====================================================
   CUSTOMER ORDERS
   ===================================================== */

window.openOrders=function(){

 document.getElementById("ordersPanel").style.display="block";

 if(!currentUser){
   document.getElementById("ordersList").innerHTML=
   "<p>Login connection तैयार हो रहा है...</p>";
   return;
 }

 const q=query(
   collection(db,"orders"),
   where("customerId","==",currentUser.uid),
   orderBy("createdAt","desc")
 );

 onSnapshot(q,snap=>{

   myOrders=[];

   snap.forEach(d=>{
     myOrders.push({id:d.id,...d.data()});
   });

   renderOrders();

 },err=>{

   console.error(err);

   document.getElementById("ordersList").innerHTML=
   `<div class="red status">
   Orders load नहीं हुए। Firebase Firestore index/rules check करें।
   </div>`;

 });

};


function renderOrders(){

 document.getElementById("ordersList").innerHTML=
 myOrders.length ?

 myOrders.map(o=>`

 <div class="order">

   <b>📦 Order #${o.id.slice(0,8)}</b>

   <div class="status">
    Status: <b>${o.status||"Order Placed"}</b>
   </div>

   <p>💰 Total: ₹${o.total}</p>

   <p>💳 ${o.paymentMethod||"COD"}</p>

   ${
    o.riderId ?

    `<p>🚚 Rider: <b>${o.riderName||"Assigned"}</b></p>

     ${
       o.status!=="Delivered" ?

       `<button class="primary"
       onclick="showRiderMap('${o.riderId}')">
       📍 Rider Live Location
       </button>`

       :""
     }`

    :

    `<p>🚚 Rider अभी assign नहीं हुआ</p>`
   }

 </div>

 `).join("")

 : "<p>अभी कोई order नहीं है।</p>";

}


/* =====================================================
   RIDER MAP
   ===================================================== */

window.showRiderMap=function(orderId){

 alert("Rider की live location Firebase से दिखाई जाएगी।");

};


/* =====================================================
   REALTIME NEW ORDER ALARM
   ===================================================== */

let alarmContext=null;

function makeAlarm(){

 try{

   alarmContext=
   new (window.AudioContext||window.webkitAudioContext)();

   const osc=alarmContext.createOscillator();
   const gain=alarmContext.createGain();

   osc.frequency.value=880;
   gain.gain.value=.15;

   osc.connect(gain);
   gain.connect(alarmContext.destination);

   osc.start();

   setTimeout(()=>{
     osc.stop();
   },700);

 }catch(e){}

}

window.startOrderAlarm=function(){
 makeAlarm();
};


/* =====================================================
   INITIAL
   ===================================================== */

renderCats();
renderProducts();
updateCartUI();

</script>

</body>
</html>
